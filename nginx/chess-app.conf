# nginx/chess-app.conf
# Slowloris-resistant reverse proxy in front of the Next.js app (server.js).
#
# Deploy (Debian/Ubuntu):
#   sudo apt-get install -y nginx
#   sudo cp nginx/chess-app.conf /etc/nginx/sites-available/chess-app.conf
#   sudo ln -sf /etc/nginx/sites-available/chess-app.conf /etc/nginx/sites-enabled/chess-app.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   # then run the app bound to loopback only:
#   HOST=127.0.0.1 npm start

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time conn=$connection '
                    'cs=$connection_status';
    access_log /var/log/nginx/access.log main;

    # --- Slowloris / slow-HTTP defenses -----------------------------------
    # A client that opens a socket and dribbles headers is dropped after 5s
    # instead of holding a worker until the pool is gone.
    client_header_timeout 5s;
    client_body_timeout   10s;
    send_timeout         10s;
    keepalive_timeout     15s;
    keepalive_requests   200;
    reset_timedout_connection on;
    tcp_nodelay on;
    tcp_nopush on;

    client_max_body_size      1m;
    client_body_buffer_size   16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --- concurrency limits -----------------------------------------------
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server            zone=perserver:10m;
    limit_req_zone  $binary_remote_addr zone=reqs:10m rate=100r/s;
    limit_conn_status 429;
    limit_req_status  429;
    limit_conn_log_level warn;
    limit_req_log_level  warn;

    upstream chess_app {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Per-client IP: 64 concurrent connections, request-rate backstop.
        limit_conn  perip 64;
        limit_conn  perserver 4096;
        limit_req   zone=reqs burst=200 nodelay;

        # --- proxy ---------------------------------------------------------
        location / {
            proxy_pass http://chess_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";      # reuse upstream keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering off;
        }

        location /_next/static/ {
            proxy_pass http://chess_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
